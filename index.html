<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sala de Mando Operativa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <div class="tech-corner tl"></div>
            <div class="tech-corner tr"></div>
            <div class="tech-corner bl"></div>
            <div class="tech-corner br"></div>
            <div class="scan-line"></div>

            <img src="https://i.ibb.co/v4pPWh2s/sundde.png" alt="Logo Sundde" class="auth-logo">
            <h2>Programación y Monitoreo</h2>
            <span class="auth-subtitle">Página en mantenimiento</span>
            
            <div class="cyber-input-wrapper">
                <i class="fas fa-key input-icon"></i>
                <input type="password" id="pin-input" class="pin-input" placeholder="ACCESO RESTRINGIDO" maxlength="6">
            </div>
            
            <button onclick="checkAuth()" class="auth-btn">
                <i class="fa-regular fa-circle-user-circle-check"></i> ACCESO RESTRINGIDO
            </button>
        </div>
    </div>

    <div id="verify-overlay">
        <div class="verify-card state-pending" id="verify-card">
            <div class="verify-icon-wrap" id="verify-icon">
                <i class="fas fa-sync-alt" id="verify-icon-i"></i>
            </div>
            <div class="verify-title" id="verify-title">Verificando contraseña</div>
            <div class="verify-sub" id="verify-sub">Por favor espere<span class="verify-dots">...</span></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
